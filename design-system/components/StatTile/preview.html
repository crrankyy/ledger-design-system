<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stat tiles</title>
<style>body{margin:0;background:var(--paper)} .ds-wrap{padding:16px 24px}</style></head>
<body>
<div class="lg-root ds-wrap">
<section class="lg-stats" aria-label="Key figures">
  <div class="lg-stat"><span class="lg-stat-label">Deploys</span><span class="lg-stat-value">148</span><span class="lg-stat-delta">▲ 74 vs last week</span></div>
  <div class="lg-stat"><span class="lg-stat-label">Change failure rate</span><span class="lg-stat-value">3.4%</span><span class="lg-stat-delta">▼ 0.8 pts vs last week</span></div>
  <div class="lg-stat"><span class="lg-stat-label">Median lead time</span><span class="lg-stat-value">9 h</span><span class="lg-stat-delta">▼ 2 h vs last week</span></div>
  <div class="lg-stat"><span class="lg-stat-label">Cloud spend</span><span class="lg-stat-value">$18.4K</span><span class="lg-stat-delta">▲ $1.2K vs last week</span></div>
</section>
</div>
</body>
</html>
